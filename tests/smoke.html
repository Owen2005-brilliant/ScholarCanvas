      <p class="smoke-label">Browser assertions</p>
      <h1 id="smoke-title">ScholarCanvas smoke tests</h1>
      <p id="smoke-summary" role="status" aria-live="polite">Running…</p>
      <ol id="smoke-results"></ol>

    <div id="app" class="smoke-app" aria-busy="true"></div>

    <div id="modal-root"></div>

    <svg class="icon-sprite" aria-hidden="true"><symbol id="icon-star" viewBox="0 0 24 24"><path d="m12 2.7 2.8 5.7 6.3.9-4.6 4.4 1.1 6.3-5.6-3-5.6 3 1.1-6.3-4.6-4.4 6.3-.9z"/></symbol><symbol id="icon-spark" viewBox="0 0 24 24"><path d="M12 2c.6 5.7 3.3 8.4 9 9-5.7.6-8.4 3.3-9 9-.6-5.7-3.3-8.4-9-9 5.7-.6 8.4-3.3 9-9z"/></symbol><symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol><symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol></svg>
